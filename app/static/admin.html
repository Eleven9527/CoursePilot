<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>课程资料管理 · My Agent</title>
  <style>
    :root{font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;color:#17211f;background:#f4f6f3;font-synthesis:none;font-optical-sizing:auto}*{box-sizing:border-box}body{margin:0}.layout{min-height:100vh;display:grid;grid-template-columns:248px 1fr}.sidebar{background:#172a25;color:#ecf3ee;padding:28px 18px}.brand{font-size:18px;font-weight:700;letter-spacing:.2px;padding:5px 10px 30px}.brand small{display:block;color:#9cafa7;font-size:12px;font-weight:500;margin-top:6px}.nav-label{padding:10px;color:#91a69d;text-transform:uppercase;font-size:11px;letter-spacing:1.2px}.nav-item{padding:12px 14px;border-radius:9px;background:#294139;color:#f5fbf7;font-size:14px}.main{padding:36px clamp(22px,5vw,72px);max-width:1500px;width:100%;margin:0 auto}.topline{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}.eyebrow{color:#6d8178;font-size:12px;font-weight:700;letter-spacing:1.4px}.topline h1{font-size:28px;margin:7px 0 0;letter-spacing:-.5px}.pill{border:1px solid #dbe2dc;background:#fff;border-radius:999px;padding:8px 12px;font-size:12px;color:#586a62}.content{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,.9fr);gap:22px;align-items:start}.card{background:#fff;border:1px solid #e3e8e3;border-radius:14px;box-shadow:0 5px 20px #172a2508}.card-head{padding:21px 22px;border-bottom:1px solid #edf0ed;display:flex;justify-content:space-between;align-items:center}.card-head h2{margin:0;font-size:16px}.muted{font-size:12px;color:#829088}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left}th{font-size:11px;letter-spacing:.7px;color:#839087;font-weight:700;background:#fafbfa;padding:12px 18px}td{padding:15px 18px;border-top:1px solid #f0f2f0;font-size:13px;color:#35443d;vertical-align:middle}.doc-name{font-weight:650;color:#1f3029;max-width:260px;overflow-wrap:anywhere}.file-badge{display:inline-block;border-radius:6px;background:#eef5f0;color:#527264;padding:5px 7px;font-size:10px;font-weight:700;text-transform:uppercase}.actions{white-space:nowrap}.btn{border:0;border-radius:8px;padding:9px 12px;font:inherit;font-size:12px;font-weight:650;cursor:pointer;transition:.15s}.btn:hover{filter:brightness(.96);transform:translateY(-1px)}.btn-primary{background:#19745b;color:white}.btn-quiet{background:#edf2ee;color:#52645b}.btn-danger{background:#fff0ed;color:#b14937;margin-left:5px}.btn-small{padding:7px 9px}.form-card{padding:22px;position:sticky;top:20px}.form-card h2{margin:0;font-size:17px}.form-intro{color:#77857d;font-size:12px;line-height:1.6;margin:7px 0 20px}.field{margin-bottom:15px}.field label{display:block;font-size:12px;font-weight:650;color:#53635b;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;border:1px solid #dfe5df;border-radius:8px;padding:11px 12px;font:inherit;font-size:13px;color:#273830;background:#fff;outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:#57a488;box-shadow:0 0 0 3px #57a48820}.field textarea{resize:vertical;min-height:86px}.field input[type=file]{padding:9px;background:#fafbfa}.hint{font-size:11px;color:#87928c;margin-top:6px}.form-actions{display:flex;gap:8px;margin-top:20px}.form-actions .btn-primary{flex:1}.empty{text-align:center;padding:55px 20px;color:#87928c;font-size:13px}.empty strong{display:block;color:#45574e;font-size:14px;margin-bottom:7px}.toast{position:fixed;right:24px;bottom:24px;background:#203b31;color:white;border-radius:9px;padding:13px 17px;font-size:13px;box-shadow:0 8px 30px #0002;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translateY(0)}.toast.error{background:#963d32}.loading{padding:30px;color:#7f8c85;font-size:13px}@media(max-width:950px){.content{grid-template-columns:1fr}.form-card{position:static}.layout{grid-template-columns:190px 1fr}.main{padding:28px 22px}}@media(max-width:680px){.layout{grid-template-columns:1fr}.sidebar{padding:14px 18px;display:flex;align-items:center;justify-content:space-between}.brand{padding:0}.brand small{display:none}.nav-label{display:none}.nav-item{padding:9px 12px}.main{padding:23px 14px}.topline h1{font-size:23px}.topline{align-items:flex-start}.pill{display:none}}
    .parse-state{display:inline-block;border-radius:999px;padding:5px 9px;font-size:11px;white-space:nowrap}.state-queued,.state-source_saved{background:#fff6df;color:#946800}.state-processing,.state-mineru_parsing,.state-chunking{background:#eaf2ff;color:#3564a0}.state-succeeded{background:#e8f5ee;color:#27714f}.state-failed,.state-mineru_failed,.state-chunking_failed{background:#fff0ed;color:#a63f32}.parse-error{max-width:180px;white-space:normal;color:#a63f32;font-size:11px;margin-top:5px}
  </style>
  <style>
    .review-dialog{width:min(1500px,96vw);height:min(900px,92vh);max-width:none;max-height:none;padding:0;border:0;border-radius:16px;box-shadow:0 24px 90px #0005;color:#17211f}.review-dialog::backdrop{background:#14221db8;backdrop-filter:blur(3px)}.review-head{height:64px;padding:0 22px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e7ece8}.review-head h2{font-size:16px;margin:0}.review-head small{display:block;color:#75847b;font-size:12px;margin-top:4px}.review-close{border:0;background:#eef2ef;border-radius:8px;padding:9px 13px;cursor:pointer}.review-grid{height:calc(100% - 64px);display:grid;grid-template-columns:1fr 1fr}.review-column{min-width:0;display:flex;flex-direction:column;border-right:1px solid #e8ece8}.review-column:last-child{border-right:0}.review-column h3{margin:0;padding:14px 18px;font-size:13px;border-bottom:1px solid #eef0ee}.review-pane{min-height:0;flex:1;overflow:auto;background:#f7f9f7}.review-pane iframe{width:100%;height:100%;border:0;background:#e8ece8}.review-pane pre{margin:0;padding:18px 20px;font:13px/1.7 ui-monospace,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;color:#293c33}.docx-preview-tools{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 14px;color:#6c7d73;font-size:12px;border-bottom:1px solid #e7ece8}.docx-preview-tools+.review-pane{}#source-pane:has(.docx-preview-tools){display:flex;flex-direction:column}#source-pane:has(.docx-preview-tools) iframe{height:auto;min-height:0;flex:1}.docx-preview-tools .review-download{margin:0}.step-list{padding:13px 16px;border-bottom:1px solid #e8ece8;max-height:190px;overflow:auto;background:#fff}.step{font-size:12px;padding:7px 0;display:grid;grid-template-columns:20px 1fr auto;gap:7px;align-items:start;border-bottom:1px solid #f0f2f0}.step:last-child{border-bottom:0}.step-error{grid-column:2/4;color:#a63f32;line-height:1.5;overflow-wrap:anywhere}.step-state{color:#6a7b71}.review-placeholder{padding:24px;color:#76847c;font-size:13px;line-height:1.7}.review-download{display:inline-block;margin:18px 20px;color:#176b53;font-weight:650}.review-summary{padding:10px 18px;color:#6c7d73;font-size:11px;border-top:1px solid #e7ece8}@media(max-width:760px){.review-dialog{height:95vh;width:98vw}.review-grid{grid-template-columns:1fr;grid-template-rows:1fr 1fr}.review-column:first-child{border-bottom:1px solid #e8ece8;border-right:0}.review-column h3{padding:10px 14px}}
  </style>
  <style>
    .review-dialog{display:flex;flex-direction:column;overflow:hidden}
    .review-head{flex:none}
    .review-grid{height:auto;flex:1;min-height:0;grid-template-rows:minmax(0,1fr);overflow:hidden}
    .review-column{height:100%;min-height:0}
    .review-pane{min-height:0;overflow:auto;overscroll-behavior:contain}
    .step-list{flex:none}
    .review-tabs{display:flex;gap:6px;padding:8px 14px;background:#fff;border-bottom:1px solid #e8ece8;flex:none}
    .review-tab{border:0;border-radius:7px;padding:7px 11px;background:transparent;color:#718078;font:inherit;font-size:12px;cursor:pointer}
    .review-tab.active{background:#eaf3ed;color:#176b53;font-weight:650}
    .stage-status{display:inline-block;margin-left:7px;padding:2px 7px;border-radius:999px;background:#edf1ee;color:#6c7d73;font-size:10px;font-weight:500;vertical-align:1px}
    .stage-status.state-succeeded{background:#e8f5ee;color:#27714f}.stage-status.state-processing,.stage-status.state-queued{background:#fff6df;color:#946800}.stage-status.state-failed{background:#fff0ed;color:#a63f32}
    .chunk-card{margin:12px;padding:13px 15px;background:#fff;border:1px solid #e2e9e3;border-radius:9px}
    .chunk-card-head{display:flex;justify-content:space-between;gap:10px;color:#718078;font-size:11px;margin-bottom:8px}
    .chunk-heading{font-weight:650;color:#176b53}
    .chunk-text{font:13px/1.75 ui-monospace,Consolas,monospace;color:#293c33;white-space:pre-wrap;overflow-wrap:anywhere}
    .review-close{width:34px;height:34px;padding:0;display:grid;place-items:center;font-size:23px;line-height:1;color:#52645b}
    .review-close:hover{background:#dfe8e1;color:#172a25}
    @media(max-width:760px){.review-grid{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(0,1fr)}.review-column{height:auto}}
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar"><div class="brand">My Agent<small>课程资料助教</small></div><div><div class="nav-label">工作台</div><div class="nav-item">▤ &nbsp;文档管理</div></div></aside>
    <main class="main">
      <header class="topline"><div><div class="eyebrow">CONTENT LIBRARY</div><h1>课程文档</h1></div><div class="pill">管理端 · 本地资料库</div></header>
      <section class="content">
        <div class="card">
          <div class="card-head"><h2>文档列表</h2><span class="muted" id="doc-count">加载中…</span></div>
          <div class="table-wrap"><table><thead><tr><th>文档</th><th>年级</th><th>单元</th><th>类型</th><th>处理状态</th><th>大小</th><th>添加时间</th><th>操作</th></tr></thead><tbody id="document-list"><tr><td colspan="8" class="loading">正在读取文档…</td></tr></tbody></table></div>
        </div>
        <section class="card form-card">
          <h2 id="form-title">添加文档</h2><p class="form-intro" id="form-intro">上传课程资料，支持 PDF、Markdown 与 DOCX，单个文件最大 20 MB。</p>
          <form id="document-form">
            <div class="field"><label for="title">文档名称</label><input id="title" name="title" maxlength="200" placeholder="例如：第 1 周课程讲义"></div>
            <div class="field"><label for="grade">适用年级</label><select id="grade" name="grade" required><option value="" disabled selected>请选择年级</option><optgroup label="小学"><option>一年级</option><option>二年级</option><option>三年级</option><option>四年级</option><option>五年级</option><option>六年级</option></optgroup><optgroup label="初中"><option>初一</option><option>初二</option><option>初三</option></optgroup><optgroup label="高中"><option>高一</option><option>高二</option><option>高三</option></optgroup><option value="未指定">未指定</option></select></div>
            <div class="field"><label for="unit">单元</label><select id="unit" required><option value="" disabled selected>请选择单元</option></select><input id="unit-value" name="unit" type="hidden"><label style="display:flex;align-items:center;gap:8px;margin-top:10px;font-weight:500"><input id="unit-range-enabled" type="checkbox" style="width:auto">这是连续多个单元</label><div id="unit-range-fields" hidden style="display:flex;align-items:center;gap:8px;margin-top:10px"><span>从</span><select id="unit-range-start" aria-label="起始单元"></select><span>到</span><select id="unit-range-end" aria-label="结束单元"></select></div><div class="hint">可选择单个单元，或指定连续范围（例如第 1-2 单元）</div></div>
            <div class="field"><label for="description">备注</label><textarea id="description" name="description" maxlength="1000" placeholder="简要说明文档内容或课程周次"></textarea></div>
            <div class="field"><label for="file">资料文件</label><input id="file" name="file" type="file" accept=".pdf,.md,.markdown,.docx" required><div class="hint" id="file-hint">支持 .pdf、.md、.markdown、.docx</div></div>
            <div class="form-actions"><button class="btn btn-primary" id="submit-button" type="submit">添加到资料库</button><button class="btn btn-quiet" id="cancel-button" type="button" hidden>取消</button></div>
          </form>
        </section>
      </section>
    </main>
  </div>
  <dialog class="review-dialog" id="review-dialog">
    <div class="review-head"><div><h2 id="review-title">文档校验</h2><small id="review-subtitle"></small></div><button class="review-close" id="review-close" type="button" aria-label="关闭校验页面" title="关闭">×</button></div>
    <div class="review-tabs" id="review-tabs"><button class="review-tab active" type="button" data-review-stage="parsing">MinerU 解析校验<span class="stage-status" data-step-status="mineru_parse">未开始</span></button><button class="review-tab" type="button" data-review-stage="chunking">文本切分校验<span class="stage-status" data-step-status="chunking">未开始</span></button></div>
    <div class="review-grid">
      <section class="review-column"><h3 id="source-column-title">原始文档</h3><div class="review-pane" id="source-pane"><div class="review-placeholder">选择文档后查看源文件</div></div><div class="review-summary" id="source-summary"></div></section>
      <section class="review-column"><h3 id="result-column-title">MinerU 解析文本</h3><div class="review-pane" id="result-pane"><div class="review-placeholder">等待解析结果</div></div><div class="review-summary" id="result-summary"></div></section>
    </div>
  </dialog>
  <div class="toast" id="toast" role="status"></div>
  <script>
    const API = '/api/v1/documents';
    const form = document.querySelector('#document-form');
    const list = document.querySelector('#document-list');
    const toast = document.querySelector('#toast');
    const reviewDialog=document.querySelector('#review-dialog');
    let editingId = null;
    let documents = [];
    let activeReviewId = null;
    let activeReviewStage = 'parsing';
    let cachedReviewChunks = null;
    let reviewMarkdownText = '';
    let reviewMarkdownError = '';
    const escapeHtml = value => String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const formatSize = bytes => bytes < 1024 * 1024 ? `${Math.max(1, Math.round(bytes / 1024))} KB` : `${(bytes / 1024 / 1024).toFixed(1)} MB`;
    const formatDate = value => new Intl.DateTimeFormat('zh-CN', {year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(value));
    const processingLabels={source_saved:'等待 MinerU 解析',mineru_parsing:'MinerU 解析中',mineru_parsed:'MinerU 解析完成',mineru_failed:'MinerU 解析失败',chunking:'文本切分中',chunking_failed:'文本切分失败',succeeded:'处理完成'};
    const unitSelect=document.querySelector('#unit');
    for(let i=1;i<=20;i++){const option=document.createElement('option');option.value=`第${i}单元`;option.textContent=`第${i}单元`;unitSelect.append(option)}
    const unspecifiedUnit=document.createElement('option');unspecifiedUnit.value='未指定';unspecifiedUnit.textContent='未指定';unitSelect.append(unspecifiedUnit);
    const rangeEnabled=document.querySelector('#unit-range-enabled');
    const rangeFields=document.querySelector('#unit-range-fields');
    const rangeStart=document.querySelector('#unit-range-start');
    const rangeEnd=document.querySelector('#unit-range-end');
    for(let i=1;i<=20;i++){for(const select of [rangeStart,rangeEnd]){const option=document.createElement('option');option.value=String(i);option.textContent=`第${i}单元`;select.append(option)}}
    function updateUnitRange(){rangeFields.hidden=!rangeEnabled.checked;rangeFields.style.display=rangeEnabled.checked?'flex':'none';unitSelect.disabled=rangeEnabled.checked;if(rangeEnabled.checked){if(Number(rangeStart.value)>=20)rangeStart.value='19';if(Number(rangeEnd.value)<=Number(rangeStart.value))rangeEnd.value=String(Number(rangeStart.value)+1);const value=`第${rangeStart.value}-${rangeEnd.value}单元`;let option=[...unitSelect.options].find(item=>item.value===value);if(!option){option=document.createElement('option');option.value=value;option.textContent=value;unitSelect.append(option)}unitSelect.value=value;document.querySelector('#unit-value').value=value}else document.querySelector('#unit-value').value=unitSelect.value}
    unitSelect.addEventListener('change',()=>{if(!rangeEnabled.checked)document.querySelector('#unit-value').value=unitSelect.value});rangeEnabled.addEventListener('change',updateUnitRange);rangeStart.addEventListener('change',updateUnitRange);rangeEnd.addEventListener('change',updateUnitRange);
    function notify(message, error=false){ toast.textContent=message;toast.className=`toast show${error?' error':''}`;setTimeout(()=>toast.className='toast',2600); }
    async function request(url, options={}){const response=await fetch(url,options);if(!response.ok){let message='操作失败';try{message=(await response.json()).detail||message}catch{}throw new Error(message)}return response.status===204?null:response.json()}
    async function loadDocuments(){
      try{documents=await request(API);document.querySelector('#doc-count').textContent=`共 ${documents.length} 份资料`;
        if(!documents.length){list.innerHTML='<tr><td colspan="8"><div class="empty"><strong>资料库还是空的</strong>从右侧上传第一份课程文档</div></td></tr>';return}
        list.innerHTML=documents.map(doc=>{const state=doc.status||'queued';const retry=['failed','mineru_failed','chunking_failed','succeeded'].includes(state);return `<tr><td><div class="doc-name" title="${escapeHtml(doc.filename)}">${escapeHtml(doc.title)}</div><div class="muted">${escapeHtml(doc.filename)}</div></td><td>${escapeHtml(doc.grade||'未指定')}</td><td>${escapeHtml(doc.unit||'未指定')}</td><td><span class="file-badge">${escapeHtml(doc.file_type)}</span></td><td><span class="parse-state state-${state}">${processingLabels[state]||'未知'}</span>${doc.processing_error?`<div class="parse-error" title="${escapeHtml(doc.processing_error)}">${escapeHtml(doc.processing_error)}</div>`:''}</td><td>${formatSize(doc.size_bytes)}</td><td>${formatDate(doc.created_at)}</td><td class="actions"><button class="btn btn-quiet btn-small" data-view="${doc.id}">校验</button>${retry?`<button class="btn btn-quiet btn-small" data-retry="${doc.id}">重试</button>`:''}<button class="btn btn-quiet btn-small" data-edit="${doc.id}">编辑</button><button class="btn btn-danger btn-small" data-delete="${doc.id}">删除</button></td></tr>`}).join('');
        if(documents.some(doc=>['queued','source_saved','mineru_parsing','chunking'].includes(doc.status)))setTimeout(loadDocuments,2000);
      }catch(error){list.innerHTML=`<tr><td colspan="8" class="empty">${escapeHtml(error.message)}</td></tr>`;notify(error.message,true)}
    }
    function resetForm(){editingId=null;form.reset();rangeStart.value='1';rangeEnd.value='2';updateUnitRange();document.querySelector('#form-title').textContent='添加文档';document.querySelector('#form-intro').textContent='上传课程资料，支持 PDF、Markdown 与 DOCX，单个文件最大 20 MB。';document.querySelector('#submit-button').textContent='添加到资料库';document.querySelector('#file').required=true;document.querySelector('#file-hint').textContent='支持 .pdf、.md、.markdown、.docx';document.querySelector('#cancel-button').hidden=true}
    function updateReviewStatus(status){
      const mineruStatus=status==='source_saved'?'queued':status==='mineru_parsing'?'processing':status==='mineru_failed'?'failed':'succeeded';
      const chunkingStatus=status==='source_saved'||status==='mineru_parsing'?'waiting':status==='mineru_failed'?'skipped':status==='mineru_parsed'?'queued':status==='chunking'?'processing':status==='chunking_failed'?'failed':'succeeded';
      for(const [key,value] of [['mineru_parse',mineruStatus],['chunking',chunkingStatus]]){
        const badge=document.querySelector(`[data-step-status="${key}"]`);badge.textContent=processingLabels[value]||({queued:'排队中',waiting:'等待上一步',processing:'处理中',skipped:'已跳过',failed:'失败',succeeded:'已完成'}[value]);badge.className=`stage-status state-${value}`;
      }
    }
    const wait = milliseconds => new Promise(resolve=>setTimeout(resolve,milliseconds));
    async function loadOrQueueChunks(documentId){
      let result=await request(`${API}/${documentId}/chunks`);
      if(['chunking_failed','succeeded'].includes(result.status)&&!result.chunks.length)result=await request(`${API}/${documentId}/chunks`,{method:'POST'});
      for(let attempt=0;attempt<20;attempt++){
        updateReviewStatus(result.status);
        if(result.status==='succeeded')return result;
        if(['mineru_failed','chunking_failed'].includes(result.status))throw new Error(result.error||'文档处理失败，请重试处理任务');
        await wait(1000);
        if(activeReviewId!==documentId||activeReviewStage!=='chunking')return null;
        result=await request(`${API}/${documentId}/chunks`);
      }
      throw new Error(`切分步骤${processingLabels[result.status]||'处理中'}。请确认 Worker 已启动，稍后重新打开校验页面查看。`);
    }
    async function renderOriginalSource(doc){
      const sourcePane=document.querySelector('#source-pane');
      if(doc.file_type==='pdf')sourcePane.innerHTML=`<iframe title="源 PDF" src="${API}/${doc.id}/source"></iframe>`;
      else if(['md','markdown'].includes(doc.file_type)){try{const response=await fetch(`${API}/${doc.id}/source`);if(!response.ok)throw new Error('源文件读取失败');const sourceText=await response.text();if(activeReviewId===doc.id&&activeReviewStage==='parsing')sourcePane.innerHTML=`<pre>${escapeHtml(sourceText)}</pre>`}catch(error){if(activeReviewId===doc.id&&activeReviewStage==='parsing')sourcePane.innerHTML=`<div class="review-placeholder">${escapeHtml(error.message)}</div>`}}
      else sourcePane.innerHTML=`<div class="docx-preview-tools"><span>DOCX 网页预览（文字与表格）</span><a class="review-download" href="${API}/${doc.id}/source">下载原始文件</a></div><iframe title="DOCX 预览" sandbox src="${API}/${doc.id}/source-preview"></iframe>`;
    }
    async function renderReviewStage(stage){
      const doc=documents.find(item=>item.id===activeReviewId);if(!doc)return;
      activeReviewStage=stage;
      document.querySelectorAll('.review-tab').forEach(button=>button.classList.toggle('active',button.dataset.reviewStage===stage));
      const sourcePane=document.querySelector('#source-pane');const resultPane=document.querySelector('#result-pane');
      if(stage==='parsing'){
        document.querySelector('#source-column-title').textContent='原始文档';
        document.querySelector('#result-column-title').textContent='MinerU 解析文本';
        document.querySelector('#source-summary').textContent=`原始文件 · ${formatSize(doc.size_bytes)}`;
        document.querySelector('#result-summary').textContent=`处理状态 · ${processingLabels[doc.status]||'等待处理'}`;
        await renderOriginalSource(doc);
        if(activeReviewId!==doc.id||activeReviewStage!==stage)return;
        resultPane.innerHTML=reviewMarkdownText?`<pre>${escapeHtml(reviewMarkdownText)}</pre>`:`<div class="review-placeholder">${escapeHtml(reviewMarkdownError||doc.processing_error||'解析结果尚未生成。MinerU 解析步骤完成后，结果会保存在这里。')}</div>`;
        return;
      }
      document.querySelector('#source-column-title').textContent='MinerU 解析文本';
      document.querySelector('#result-column-title').textContent='文本切分结果';
      document.querySelector('#source-summary').textContent=`解析文本 · ${reviewMarkdownText.length} 字符`;
      document.querySelector('#result-summary').textContent='切分结果';
      sourcePane.innerHTML=reviewMarkdownText?`<pre>${escapeHtml(reviewMarkdownText)}</pre>`:`<div class="review-placeholder">${escapeHtml(reviewMarkdownError||doc.processing_error||'解析文本尚未生成，无法进行切分校验。')}</div>`;
      resultPane.innerHTML='<div class="review-placeholder">正在加载切分结果…</div>';
      try{
        if(!reviewMarkdownText){
          const response=await fetch(`${API}/${doc.id}/result`);
          if(!response.ok)throw new Error('MinerU 解析文本尚未生成，请稍后再查看切分校验');
          reviewMarkdownText=await response.text();
          if(activeReviewId!==doc.id||activeReviewStage!==stage)return;
          sourcePane.innerHTML=`<pre>${escapeHtml(reviewMarkdownText)}</pre>`;
          document.querySelector('#source-summary').textContent=`解析文本 · ${reviewMarkdownText.length} 字符`;
        }
        if(!cachedReviewChunks)cachedReviewChunks=await loadOrQueueChunks(activeReviewId);
        if(!cachedReviewChunks)return;
        if(activeReviewId!==doc.id||activeReviewStage!==stage)return;
        if(!cachedReviewChunks.chunks.length){resultPane.innerHTML='<div class="review-placeholder">文档没有可切分的文字内容</div>';return}
        resultPane.innerHTML=cachedReviewChunks.chunks.map(chunk=>`<article class="chunk-card"><div class="chunk-card-head"><span>文本块 ${chunk.chunk_index+1} · ${chunk.char_count} 字符</span><span>${escapeHtml(chunk.metadata.grade)} · ${escapeHtml(chunk.metadata.unit)}</span></div>${chunk.heading?`<div class="chunk-card-head chunk-heading">${escapeHtml(chunk.heading)}</div>`:''}<div class="chunk-text">${escapeHtml(chunk.text)}</div></article>`).join('');
        document.querySelector('#result-summary').textContent=`切分结果 · ${cachedReviewChunks.chunk_count} 个文本块`;
      }catch(error){resultPane.innerHTML=`<div class="review-placeholder">${escapeHtml(error.message)}</div>`}
    }
    async function openReview(documentId){
      const doc=documents.find(item=>item.id===documentId);if(!doc)return;
      activeReviewId=documentId;cachedReviewChunks=null;reviewMarkdownText='';reviewMarkdownError='';activeReviewStage='parsing';
      document.querySelector('#review-title').textContent=doc.title;
      document.querySelector('#review-subtitle').textContent=`${doc.grade} · ${doc.unit} · ${doc.filename}`;
      document.querySelector('#source-pane').innerHTML='<div class="review-placeholder">正在加载校验内容…</div>';
      document.querySelector('#result-pane').innerHTML='<div class="review-placeholder">正在读取解析结果…</div>';
      updateReviewStatus(doc.status);
      reviewDialog.showModal();
      if(['mineru_parsed','chunking','chunking_failed','succeeded'].includes(doc.status)){
        try{const response=await fetch(`${API}/${doc.id}/result`);if(!response.ok)throw new Error((await response.json()).detail||'读取解析结果失败');reviewMarkdownText=await response.text()}
        catch(error){reviewMarkdownError=error.message}
      }
      await renderReviewStage(activeReviewStage);
    }
    document.querySelector('#review-close').addEventListener('click',()=>reviewDialog.close());
    document.querySelector('#review-tabs').addEventListener('click',event=>{
      const button=event.target.closest('[data-review-stage]');if(button)renderReviewStage(button.dataset.reviewStage);
    });
    list.addEventListener('click', async event=>{
      const editButton=event.target.closest('[data-edit]');const deleteButton=event.target.closest('[data-delete]');const retryButton=event.target.closest('[data-retry]');const viewButton=event.target.closest('[data-view]');
      if(viewButton)await openReview(viewButton.dataset.view);
      if(retryButton){retryButton.disabled=true;try{await request(`${API}/${retryButton.dataset.retry}/process`,{method:'POST'});notify('文档已重新进入处理流程');await loadDocuments()}catch(error){notify(error.message,true)}finally{retryButton.disabled=false}}
      if(editButton){const doc=documents.find(item=>item.id===editButton.dataset.edit);if(!doc)return;editingId=doc.id;document.querySelector('#title').value=doc.title;document.querySelector('#grade').value=doc.grade||'未指定';const range=(doc.unit||'').match(/^第(\d+)-(\d+)单元$/);if(range){rangeEnabled.checked=true;rangeStart.value=range[1];rangeEnd.value=range[2];updateUnitRange()}else{rangeEnabled.checked=false;updateUnitRange();unitSelect.value=doc.unit||'未指定'}document.querySelector('#description').value=doc.description;document.querySelector('#form-title').textContent='编辑文档';document.querySelector('#form-intro').textContent=`当前文件：${doc.filename}。可以修改信息，也可以选择新文件替换。`;document.querySelector('#submit-button').textContent='保存修改';document.querySelector('#file').required=false;document.querySelector('#file-hint').textContent='不选文件则保留原文件';document.querySelector('#cancel-button').hidden=false;document.querySelector('#title').focus();}
      if(deleteButton){const doc=documents.find(item=>item.id===deleteButton.dataset.delete);if(!doc||!confirm(`确定删除“${doc.title}”及其上传文件吗？此操作无法撤销。`))return;try{await request(`${API}/${doc.id}`,{method:'DELETE'});if(editingId===doc.id)resetForm();notify('文档已删除');await loadDocuments()}catch(error){notify(error.message,true)}}
    });
    document.querySelector('#cancel-button').addEventListener('click',resetForm);
    form.addEventListener('submit',async event=>{
      event.preventDefault();const data=new FormData(form);const file=document.querySelector('#file').files[0];if(!editingId&&!file){notify('请先选择一个文件',true);return}if(file&&file.size>20*1024*1024){notify('文件不能超过 20 MB',true);return}
      const button=document.querySelector('#submit-button');button.disabled=true;button.textContent='正在保存…';
      try{await request(editingId?`${API}/${editingId}`:API,{method:editingId?'PUT':'POST',body:data});notify(editingId?'修改已保存':'文档已添加');resetForm();await loadDocuments()}catch(error){notify(error.message,true)}finally{button.disabled=false;button.textContent=editingId?'保存修改':'添加到资料库'}
    });
    loadDocuments();
  </script>
</body>
</html>
