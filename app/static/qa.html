<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>课程问答 · CoursePilot</title>
  <style>
    :root{font:16px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;color:#172b2b;background:#f2f6f3}
    [v-cloak]{display:none} *{box-sizing:border-box} body{margin:0}
    .layout{min-height:100vh;display:grid;grid-template-columns:248px minmax(0,1fr)}
    main{width:100%;max-width:780px;margin:0 auto;padding:36px 20px}
    @media(max-width:950px){.layout{grid-template-columns:190px minmax(0,1fr)}}
    @media(max-width:680px){.layout{grid-template-columns:1fr;grid-template-rows:auto 1fr}main{padding:23px 14px}}
    header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #cbd9d1;padding-bottom:16px;margin-bottom:28px}
    h1{font-size:32px;margin:0} a{color:#246b55} form,section{background:white;border:1px solid #d7e4db;border-radius:14px;padding:24px;margin:0 0 20px}
    .scope{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:18px}.scope label{flex:1;min-width:125px}
    label{display:block;font-weight:600} select,textarea,button{font:inherit} select,textarea{display:block;width:100%;margin-top:5px;padding:8px 10px;border:1px solid #aebfb6;border-radius:8px;background:white;color:inherit}
    textarea{min-height:110px;resize:vertical} button{margin-top:16px;padding:9px 20px;background:#17634b;color:white;border:0;border-radius:8px;cursor:pointer} button:disabled{opacity:.55;cursor:default}
    #status{margin:0 0 14px;color:#405850} #answer p,blockquote{white-space:pre-wrap;overflow-wrap:anywhere} h2{margin-top:0;font-size:21px}
    #answer p{margin:0;line-height:1.8} #answer p+p{margin-top:14px}
    .answer-sources{margin-top:20px}.answer-sources h3{font-size:14px;color:#405850;margin:0 0 6px}
    details{border-top:1px solid #d7e4db;padding:12px 0} summary{cursor:pointer} blockquote{margin:10px 0 0;padding-left:12px;border-left:3px solid #a6c8b7}
  </style>
  <link rel="stylesheet" href="/assets/sidebar.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">My Agent<small>课程资料助教</small></div>
    <nav aria-label="工作台">
      <div class="nav-label">工作台</div>
      <a class="nav-link" href="/admin"><span aria-hidden="true">▤</span>文档管理</a>
      <a class="nav-link" href="/qa" aria-current="page"><span class="nav-chat" aria-hidden="true"></span>课程问答</a>
    </nav>
  </aside>
<main id="qa-app" v-cloak data-api-prefix="__QA_API_PREFIX__">
  <header><h1>课程问答</h1></header>
  <form @submit.prevent="ask">
    <div class="scope">
      <label>年级<select v-model="grade" required>
        <option v-for="item in Object.keys(scopes)" :key="item" :value="item">{{ item }}</option>
      </select></label>
      <label>起始单元<select v-model.number="start" required>
        <option v-for="unit in units" :key="unit" :value="unit">第 {{ unit }} 单元</option>
      </select></label>
      <label>结束单元<select v-model.number="end" required>
        <option v-for="unit in endUnits" :key="unit" :value="unit">第 {{ unit }} 单元</option>
      </select></label>
    </div>
    <label>问题<textarea v-model.trim="question" required maxlength="1000" placeholder="例如：借相机两个月的题为什么用 have kept？"></textarea></label>
    <button :disabled="busy || !grade || !question">提问</button>
  </form>
  <p v-if="status" id="status" role="status">{{ status }}</p>
  <section v-if="result">
    <h2>回答</h2>
    <div id="answer">
      <p v-for="(paragraph, index) in answerParagraphs" :key="index">{{ paragraph }}</p>
    </div>
    <div v-if="result.sources.length" class="answer-sources">
      <h3>引用资料</h3>
      <details v-for="source in result.sources" :key="source.chunk_id">
        <summary>[{{ source.number }}] {{ source.title }} · {{ source.heading || source.unit }}</summary>
        <blockquote>{{ source.text }}</blockquote>
      </details>
    </div>
  </section>
</main>
</div>
<script src="/assets/vue.global.prod.js"></script>
<script>
  const root = document.querySelector('#qa-app');
  const api = root.dataset.apiPrefix + '/qa';

  Vue.createApp({
    data() {
      return {scopes: {}, grade: '', start: null, end: null, question: '',
              busy: false, status: '正在读取可用资料…', result: null};
    },
    computed: {
      answerParagraphs() {
        return (this.result?.answer || '').split(/\r?\n[ \t]*\r?\n|(?<=[。！？])[ \t]*(?=第\s*[一二三四五六七八九十百\d]+\s*题)/u)
          .map(paragraph => paragraph.trim()).filter(Boolean);
      },
      units() { return this.scopes[this.grade] || []; },
      endUnits() { return this.units.filter(unit => unit >= this.start); },
    },
    watch: {
      grade() { this.start = this.units[0] ?? null; this.end = this.start; },
      start() { if (!this.endUnits.includes(this.end)) this.end = this.start; },
    },
    async mounted() {
      try {
        this.scopes = await this.request('/scopes');
        this.grade = Object.keys(this.scopes)[0] || '';
        this.status = this.grade ? '' : '暂无已完成向量化且标注年级和单元的资料。';
      } catch (error) {
        this.status = error.message;
      }
    },
    methods: {
      async request(path, options) {
        const response = await fetch(api + path, options);
        const data = await response.json();
        if (!response.ok) throw new Error(typeof data.detail === 'string' ? data.detail : '请求失败');
        return data;
      },
      async ask() {
        if (this.busy || !this.question || !this.grade) return;
        this.busy = true;
        this.result = null;
        this.status = '正在检索资料并生成回答…';
        try {
          this.result = await this.request('/ask', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({question: this.question, grade: this.grade,
                                  unit_start: this.start, unit_end: this.end}),
          });
          this.status = '';
        } catch (error) {
          this.status = error.message;
        } finally {
          this.busy = false;
        }
      },
    },
  }).mount(root);
</script>
</body>
</html>
